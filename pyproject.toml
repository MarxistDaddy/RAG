[project]
name = "rag"
version = "0.1.0"
description = "all the dependencies of the RAG project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.11",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.2",
    "fire>=0.7.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 79

[tool.mypy]
exclude = ".venv"
